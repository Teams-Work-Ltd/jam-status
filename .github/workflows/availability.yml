name: Check public availability

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: public-availability
  cancel-in-progress: true

jobs:
  check:
    name: Check Jam status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request public page
        env:
          EXPECTED_MARKER: <title>Jam service status</title>
          TARGET_URL: https://jam-status.netlify.app/
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          curl \
            --fail \
            --location \
            --max-time 20 \
            --output "$response_file" \
            --retry 2 \
            --retry-delay 3 \
            --show-error \
            --silent \
            --user-agent "Jam-Availability-Monitor/1.0 (+https://github.com/Teams-Work-Ltd/jam-status)" \
            "$TARGET_URL"
          grep --fixed-strings --quiet "$EXPECTED_MARKER" "$response_file"
